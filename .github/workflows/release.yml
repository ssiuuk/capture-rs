name: Release

# Builds the Windows binaries for a GitHub release and attaches them to it.
# Runs when a release is published; use "Run workflow" to (re)build an
# existing release by its tag.
#
# When the SIGNPATH_API_TOKEN secret is set, the app exe and the installer are
# code signed through SignPath (see "Code signing policy" in README.md). The
# app exe is signed before it is bundled, so the installer ships the signed
# exe. Without the secret the binaries are uploaded unsigned.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. 0.1.0
        required: true

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Build and upload
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build exe
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      - name: Read app version
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $version = (Get-Content app/tauri.conf.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Upload unsigned exe
        id: unsigned-exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: target/release/capture-rs.exe
          archive: false
      - name: Sign exe
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'capture-rs' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
          wait-for-completion: true
          # Release signing waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/exe
          skip-decompress: true
      - name: Use signed exe
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item signed/exe/capture-rs.exe target/release/capture-rs.exe -Force
      - name: Build installer
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 bundle --bundles nsis
      - name: Find installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          "path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($installer.Name)" >> $env:GITHUB_OUTPUT
      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
      - name: Sign installer
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'capture-rs' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.APP_VERSION) }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer
          skip-decompress: true
      - name: Use signed installer
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: Copy-Item "signed/installer/${{ steps.installer.outputs.name }}" "${{ steps.installer.outputs.path }}" -Force
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/capture-rs.exe "dist/capture-rs-$env:TAG-x64-portable.exe"
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist
      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist/*.exe).FullName --clobber --repo "$env:GITHUB_REPOSITORY"
