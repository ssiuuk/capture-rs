name: Release

# Builds the Windows binaries for a GitHub release and attaches them to it.
# Runs when a release is published; use "Run workflow" to (re)build an
# existing release by its tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. 0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Build and upload
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build installer and exe
        working-directory: app
        run: npx --yes @tauri-apps/cli@2 build --bundles nsis
      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/capture-rs.exe "dist/capture-rs-$env:TAG-x64-portable.exe"
          Copy-Item target/release/bundle/nsis/*.exe dist/
          Get-ChildItem dist
      - name: Upload to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:TAG" (Get-ChildItem dist/*.exe).FullName --clobber --repo "$env:GITHUB_REPOSITORY"
