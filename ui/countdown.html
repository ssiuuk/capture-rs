<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>capture-rs countdown</title>
  <style>
    [hidden] { display: none !important; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; font-family: "Segoe UI", system-ui, sans-serif; }
    .dial {
      position: relative; width: 168px; height: 168px; border-radius: 50%;
      background: rgba(15, 23, 32, 0.78); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
      animation: appear 0.3s ease-out both;
    }
    .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 6; }
    .ring .track { stroke: rgba(255, 255, 255, 0.15); }
    .ring .progress { stroke: #38bdf8; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    .number { font-size: 72px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .number.tick { animation: tick 1s ease-out; }
    .label { margin-top: 6px; font-size: 13px; color: #cbd5e1; }
    @keyframes appear { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: none; } }
    @keyframes tick { 0% { transform: scale(1.25); opacity: 0.4; } 30% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>
  <div class="dial">
    <svg class="ring" viewBox="0 0 168 168">
      <circle class="track" cx="84" cy="84" r="78" />
      <circle class="progress" id="progress" cx="84" cy="84" r="78" />
    </svg>
    <div id="number" class="number"></div>
    <div class="label">Capturing in</div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
